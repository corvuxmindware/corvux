[package]
name = "tauri-plugin-ios-picker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Corvux-internal plugin: iOS UIDocumentPickerViewController folder picker + security-scoped bookmarks"
publish = false
links = "tauri-plugin-ios-picker"

[lib]
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }
