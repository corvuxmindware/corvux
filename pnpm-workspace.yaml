# pnpm 10 reads overrides + build-script approvals from here instead of
# package.json.

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild

# Security overrides for transitive deps whose direct parents haven't
# updated yet. Drop these when:
#   - postcss: vite (currently 6.4.2) moves past 8.5.10. Vite 7/8 already
#     bundles postcss 8.5.10+.
#   - uuid: mermaid releases a build whose uuid range moves past 11.1.0.
# Caret on uuid keeps us inside v11 — bare ">=11.1.1" lets pnpm jump to
# v14 which changes API surface mermaid hasn't been tested against.
overrides:
  postcss: ">=8.5.10"
  uuid: "^11.1.1"
  # katex: mermaid 11 pins ^0.16.47, but the prototype-pollution fix
  # (GHSA "KaTeX: existing prototype pollution can bypass trust
  # restrictions") is only in 0.18.2+. Mermaid only calls
  # `katex.renderToString(..., { output: "mathml" })`, which 0.17/0.18 did
  # not change (0.17 changed an internal API, 0.18 prefixed CSS classes).
  # Mermaid 12 accepts 0.18 natively but requires Safari 17.4+, which would
  # drop iOS 14-17.3 / older macOS. Drop this override with mermaid 12.
  # Pinned exactly: 0.18.11 is deprecated upstream ("accidentally published
  # with breaking changes"), so a caret range would pick it up.
  katex: "0.18.10"
